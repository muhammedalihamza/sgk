"Önceleri aile, vakıf ve loncalar korumayı üstlendi. Sanayi devrimiyle işçiler risk altında kalınca devlet devreye girdi. 1883’te Almanya’da hastalık sigortası, ardından kaza ve yaşlılık sigortaları kuruldu. 1935 ABD Sosyal Güvenlik Yasası ve 1942 Beveridge Raporu (İngiltere) dönüm noktalarıdır.",
"Osmanlı’da vakıflar ve esnaf örgütleri koruma sağladı. Cumhuriyet’te 1945’te İşçi Sigortaları Kurumu, 1949’da Emekli Sandığı, 1964’te SSK, 1971’de Bağ-Kur kuruldu. Bu parçalı yapı 2006-2008 reformuyla toplandı: SGK kuruldu, 5510 sayılı Kanun yürürlüğe girdi.",
"Türk sistemi sosyal sigortalar (kısa vadeli: iş kazası-meslek hastalığı, hastalık, analık; uzun vadeli: malullük, yaşlılık, ölüm), genel sağlık sigortası, sosyal yardım ve hizmetlerden oluşur. 5510’da sigortalılar 4/a (işçi), 4/b (kendi hesabına çalışan), 4/c (kamu görevlisi) diye ayrılır."],
["Tarih, geçmişi belgelere dayanarak inceleyen bilimdir. İnkılap köklü ve hızlı değişimdir; ıslahat ise mevcut düzeni düzeltmedir. Bu derste son dönem Osmanlı’dan Cumhuriyet’e uzanan değişim süreci incelenir.",
"Çöküşün nedenleri iç (yönetim bozukluğu, ekonomi, isyanlar) ve dış (büyük devletlerin çıkar rekabeti) diye ayrılır. Son dönemde II. Meşrutiyet (1908), Trablusgarp (1911) ve Balkan Savaşları (1912-13) imparatorluğu çok zayıflattı.",
"Savaş iki blok arasında çıktı: İtilaf (İngiltere, Fransa, Rusya) ve İttifak (Almanya, Avusturya-Macaristan). Nedenler: sömürge ve pazar rekabeti, silahlanma, milliyetçilik. 28 Haziran 1914’te Saraybosna suikastı savaşı başlattı. Osmanlı 1914 sonunda Almanya yanında savaşa girdi.",
"Osmanlı birçok cephede savaştı: Kafkas, Çanakkale, Irak, Suriye-Filistin, Hicaz-Yemen, Galiçya, Romanya, Makedonya. Çanakkale 1915’te açıldı ve Mustafa Kemal’in öne çıktığı cephedir. Kafkas Cephesi’nde Sarıkamış ağır kayıplarla anılır.",
"Savaş kaybedilince 30 Ekim 1918’de Mondros imzalandı; bu antlaşma işgallere kapı açtı. Savaş sırasında yapılan gizli antlaşmalar (Sykes-Picot gibi) Osmanlı topraklarını paylaşmayı planlıyordu. İzmir 15 Mayıs 1919’da Yunanlar tarafından işgal edildi.",
"İşgallere karşı halk örgütlendi: Müdafaa-i Hukuk ve Redd-i İlhak cemiyetleri siyasi-hukuki, Kuvayımilliye silahlı yerel direniştir. Başta dağınık olan bu hareketler sonra Mustafa Kemal önderliğinde tek merkezde toplandı.",
"Mustafa Kemal 19 Mayıs 1919’da Samsun’a çıktı; milli mücadele başladı. 22 Haziran 1919 Amasya Genelgesi’nde ‘Vatanın bütünlüğü, milletin istiklali tehlikededir’ denildi ve milli iradenin kurtaracağı vurgulandı; kongre yolu açıldı."],
["Dil; sesler, sözcükler ve kurallar sistemidir. Özellikleri: toplumsal, sesli, anlaşma aracı, canlı ve değişken. İşlevleri: anlaşma, düşünme, kültür aktarımı. Türleri: konuşma ve yazı dili; doğal diller ile yapay diller (Esperanto).",
"Kültür bir toplumun yaşayış biçimidir; dil bu birikimi taşır. Dil olmadan düşünce ve kültür aktarılamaz. Dil ile düşünce karşılıklı etkileşir: sözcük zenginliği düşünceyi besler. Kültür değişirse dil de değişir.",
"Diller soy bakımından (diller ailesi) ve yapı bakımından (tek heceli, eklemeli, bükümlü) sınıflanır. Çince tek heceli, Türkçe eklemeli, Arapça ve Almanca bükümlüdür. Türkçe eklemeli yapısı ve ses uyumlarıyla ayrışır.",
"Türkçenin bilinen yazılı tarihi Orhun Yazıtları (8. yy) ile başlar. Dönemler: Eski Türkçe, Orta Türkçe, Yeni Türkçe. Anadolu’da Eski Anadolu Türkçesi, Osmanlı Türkçesi ve bugünkü Türkiye Türkçesi gelişti.",
"Ses bilgisi dilin seslerini inceler. Türkçede 8 ünlü ve 21 ünsüz vardır. Ünlüler kalın (a ı o u) – ince (e i ö ü), düz (a e ı i) – yuvarlak (o ö u ü), geniş – dar diye ayrılır. Sert ünsüzler: f, s, t, k, ç, ş, h, p (fıstıkçı şahap).",
"Büyük ünlü uyumu: sözcükte ünlüler ya hep kalın ya hep ince olur (kalem-ler). Küçük ünlü uyumu: düz ünlüden sonra düz, yuvarlak ünlüden sonra düz-geniş ya da dar-yuvarlak ünlü gelir. Ünsüz benzeşmesi: sert ünsüzden sonra sert ünsüz gelir (kitap-ta).",
"Kök, sözcüğün anlamlı en küçük parçasıdır. Yapım ekleri yeni sözcük türetir (göz-lük), çekim ekleri sözcüğü cümleye uydurur (ev-ler, gel-di-m). Sıra: kök + yapım ekleri + çekim ekleri (göz-lük-çü-ler)."],
["Toplum düzeni için dört kural vardır: din, ahlak, görgü, hukuk. Hukuk kuralları genel, soyut ve zorlayıcıdır; yaptırımı devlet uygular. Ahlakın yaptırımı vicdanda, görgünün yaptırımı toplumun kınamasındadır.",
"Hukukun kaynakları yazılı (anayasa, kanun, tüzük, yönetmelik) ve yazısız (örf-adet) olarak ayrılır. Normlar hiyerarşisi: Anayasa en üstte; altında kanun ve uluslararası andlaşmalar, KHK; sonra tüzük, yönetmelik. Alt norm üst norma aykırı olamaz.",
"Kamu hukuku devletin egemenlik gücüyle yer aldığı ilişkileri düzenler: anayasa, idare, ceza, vergi hukuku. Özel hukuk eşit kişiler arasını düzenler: medeni, borçlar, ticaret hukuku. Ölçüt: ilişkide devlet egemenlik gücüyle yer alıyor mu?",
"Hak, hukuk düzeninin kişiye tanıdığı yetkidir. Mutlak haklar herkese karşı ileri sürülür (mülkiyet); nispi haklar yalnız belli kişiye karşı (alacak). Haklar doğum, hukuki işlem, miras, haksız fiil gibi sebeplerle kazanılır.",
"TMK m.2’ye göre herkes haklarını kullanırken ve borçlarını öderken dürüstlük kuralına uymak zorundadır; hakkın açıkça kötüye kullanılmasını hukuk korumaz. Hakların korunması için dava açılır ve iddia ispat edilir.",
"Hak ehliyeti, hak sahibi olabilmedir; doğumla başlar, ölümle biter. Fiil ehliyeti, kendi işlemleriyle hak ve borç doğurabilmedir; bunun için ergin (18 yaş), ayırt etme gücüne sahip ve kısıtlı olmama şartları aranır.",
"Tüzel kişi, hukukun kişilik tanıdığı topluluklardır: kişi toplulukları (dernek, şirket) ve mal toplulukları (vakıf). Kendi adına hak ve borç sahibi olur; malvarlığı ortaklardan ayrıdır. Kişilik, kuruluş ve tescille kazanılır."],
["İşletme, mal ve hizmet üretip karşılığında gelir sağlayan ekonomik birimdir. Çevresi iki parçadır: genel çevre (ekonomik, siyasi, teknolojik) ve görev çevresi (müşteri, rakip, tedarikçi). İşletme çevresini etkiler, çevresinden etkilenir.",
"Amaçlar: ekonomik (kâr), sosyal ve kültürel; hayatta kalma ve büyüme. Sınıflama: mülkiyete göre (özel, kamu, karma), büyüklüğe göre (KOBİ…), faaliyet alanına göre (tarım, sanayi, hizmet), hukuki yapıya göre (kolektif, anonim, limited).",
"Kuruluş süreci: fikir, fizibilite, finansman, hukuki yapı seçimi, tescil. Yer seçiminde ham madde, pazar, işgücü, ulaşım, enerji ve teşvikler değerlendirilir. Yanlış yer seçimi maliyeti kalıcı olarak yükseltir.",
"Yönetim; planlama, örgütleme, yöneltme, koordinasyon ve denetimden oluşur (Fayol). Organizasyon, iş ve yetkilerin dağıtılmasıdır. Yönetim kademeleri: üst, orta, alt kademe.",
"Üretim, girdilerin (emek, sermaye, hammadde) çıktıya dönüştürülmesidir. Verimlilik = çıktı / girdi. Üretim sürekli, parça (parti) ya da proje tipinde olabilir. Kalite, maliyet, stok ve zaman ana hedeflerdir.",
"Pazarlama, müşteri ihtiyaçlarını belirleyip karşılamaktır. Pazarlama karması 4P’dir: ürün, fiyat, dağıtım (yer), tutundurma (reklam, promosyon). Pazar bölümlendirme ve hedef kitle seçimi de temel kavramlardır.",
"İK, işgörenin işletmeye kazandırılması ve geliştirilmesidir: planlama, işe alma, seçme-yerleştirme, eğitim, ücret yönetimi, performans değerlendirme, işten ayrılma. Amaç doğru kişiyi doğru işe koymaktır."],
["Ekonomi, kıt kaynaklarla sınırsız ihtiyaçları karşılama bilimidir. Kıtlık yüzünden seçim yapılır ve her seçim bir fırsat maliyeti doğurur. Fayda, ihtiyacı karşılama düzeyidir. Mikro ekonomi tek tek birimleri, makro ekonomi bütün ekonomiyi inceler.",
"Toplam fayda tüm birimlerin toplam doyumu, marjinal fayda son birimin katkısıdır. Tüketim arttıkça marjinal fayda azalır. Tüketici bütçesiyle en yüksek faydayı sağlayacak mal bileşimini seçer.",
"Üretici girdileri (emek, sermaye) kullanıp çıktı üretir. Kısa dönemde bazı faktörler sabittir; azalan verimler yasası: değişken faktör artırıldıkça ek verim bir noktadan sonra düşer. Maliyetler sabit ve değişken diye ayrılır.",
"Talep, belli fiyattan alınmak istenen miktardır. Fiyat artarsa talep edilen miktar azalır; eğri aşağı eğimlidir. Gelir, zevk, ikame mal fiyatı gibi fiyat dışı etkenler eğriyi kaydırır; fiyat ise eğri üzerinde hareket ettirir.",
"Arz, satıcıların satmak istediği miktardır. Fiyat artarsa arz edilen miktar artar; eğri yukarı eğimlidir. Maliyet, teknoloji ve satıcı sayısı eğriyi kaydırır; fiyat değişimi eğri üzerinde hareket yaratır.",
"Piyasa dengesi arz ve talep eğrilerinin kesiştiği noktadır. Fiyat dengenin üstündeyse arz fazlası, altındaysa talep fazlası oluşur ve fiyat dengeye döner. Arz veya talep kayarsa yeni denge oluşur.",
"Esneklik, fiyat değişimine miktarın tepkisidir: %ΔMiktar / %ΔFiyat. Mutlak değer 1’den büyükse talep esnek, küçükse esnek değildir. Zorunlu mallar (ekmek) esnek olmaz, lüks mallar esnektir."],
["Muhasebe, işletmenin parayla ölçülebilen işlemlerini kaydeden, sınıflayan, özetleyen ve raporlayan bir bilgi sistemidir. Kullanıcıları: ortaklar, yöneticiler, kredi verenler, devlet. Amaç doğru karar için güvenilir bilgi sağlamaktır.",
"Temel kavramlar: işletmenin sürekliliği, dönemsellik, tarihi maliyet, tutarlılık, ihtiyatlılık, parayla ölçülme, işletme-sahibi ayrımı. Bu ilkeler kayıtların her işletmede aynı mantıkla tutulmasını sağlar.",
"Varlık, işletmenin sahip olduklarıdır (kasa, banka, stok, bina). Kaynak, bunların nasıl finanse edildiğidir: yabancı kaynak (borç) ve özkaynak (ortak sermayesi). Eşitlik: Varlıklar = Kaynaklar. Her işlem bu eşitliği bozmaz.",
"Hesap, aynı cins kalemlerin izlendiği birimdir. T hesapta sol taraf borç, sağ taraf alacaktır. Her işlemde borçlanan hesapların toplamı alacaklanan hesapların toplamına eşittir (çift taraflı kayıt). Aktif hesaplar borçla, pasif hesaplar alacakla artar.",
"Her işlem önce belgeyle (fatura, makbuz) kanıtlanır, sonra fişe bağlanır: tahsilat (para girişi), tediye (para çıkışı), mahsup (para hareketi olmayan). Fişlerden sonra defterlere kayıt yapılır.",
"Yevmiye defteri işlemleri tarih sırasıyla kaydeder. Büyük defter aynı hesabın hareketlerini bir araya toplar. Kayıt önce yevmiyeye, sonra büyük deftere aktarılır. İkisi de ana defterlerdir.",
"Mizan, büyük defter toplam ve bakiyelerinin eşitliğini sınar (borç = alacak). Bilanço belli tarihte varlık ve kaynakları, gelir tablosu belli dönemde gelir, gider ve kâr/zararı gösterir; ikisi temel finansal tablolardır."],
["Özne zamirleri: I, you, he, she, it, we, you, they. ‘To be’: I am, you/we/they are, he/she/it is. Olumsuz: am not, isn’t, aren’t. Soru: Is she a teacher? Cevap: Yes, she is.",
"This/that tekil (this yakın, that uzak), these/those çoğuldur. Sahiplik sıfatları isimden önce gelir: my, your, his, her, its, our, their. Örnek: These are my keys.",
"Çoğul genelde -s alır (book-books); s, x, ch, sh’den sonra -es (box-boxes); ünsüz+y → -ies (city-cities). Düzensiz: man-men, child-children. Ünsüz sesten önce a, ünlü sesten önce an, bilinen şey için the kullanılır.",
"Sahiplik: I/you/we/they have got, he/she/it has got. Olumsuz: haven’t got, hasn’t got. Soru: Have you got a pen? Yes, I have. Has she got a car? No, she hasn’t.",
"Geniş zaman alışkanlık ve genel gerçekler içindir. I/you/we/they + fiil; he/she/it + fiil-s. Olumsuz: don’t / doesn’t + fiilin yalın hali (He doesn’t like tea). Sıklık zarfları: always, usually, never.",
"Soru: Do/Does + özne + fiil (Do you work? Does he work?). Wh- soruları başa gelir: Where does she live? What do you do? Does kullanılınca fiil -s almaz.",
"Saat: It’s half past six, quarter to eight. Gün ve aylar büyük harfle yazılır. Edatlar: at (saat: at 5), on (gün/tarih: on Monday), in (ay/yıl/mevsim: in May)."]];
const X={
"3-0":["İnsan toplum içinde yaşadığı için davranışlarını düzenleyen kurallara ihtiyaç duyar. Bunlara sosyal kurallar denir; dört türü vardır ve hukuk bunlardan yalnızca biridir.","<b>Din kuralları:</b> ilahi kaynaklıdır, yaptırımı ahiret ve vicdana bağlıdır; kişinin Tanrı’ya karşı ödevlerini düzenler.","<b>Ahlak kuralları:</b> vicdandan doğar, yaptırımı manevidir (vicdan azabı); iyi-kötü ayrımı yapar.","<b>Görgü (nezaket) kuralları:</b> selam vermek, yer vermek gibi; yaptırımı toplumun hoş görmemesi ve dışlamasıdır.","<b>Hukuk kuralları:</b> devletçe konur; genel (herkese), soyut (tek olaya değil, tipik olaylara) ve zorlayıcıdır. Yaptırımı devlet gücüyle uygulanır (tazminat, hapis, işlemin geçersizliği).","‘Yaptırımı maddi ve devletçe uygulanan kural’ ifadesi hep hukuku gösterir."],
"3-1":["Hukukun kaynağı, hukuk kuralının nereden çıktığını gösterir. Asli kaynaklar yazılı kurallar ve örf-adettir; yargı kararları ve bilim görüşleri (doktrin) yardımcı kaynaktır.","<b>Anayasa:</b> devletin temel düzenini kuran en üst normdur; diğer tüm normlar ona uygun olmak zorundadır.","<b>Kanun:</b> TBMM’nin çıkardığı yazılı kuraldır. Altında Cumhurbaşkanlığı kararnamesi ve yönetmelikler yer alır.","<b>Uluslararası andlaşmalar:</b> usulüne göre yürürlüğe girince kanun gücündedir; temel hak ve özgürlüklerde çatışma olursa andlaşma esas alınır.","<b>Örf ve âdet:</b> uzun süre uygulanıp hukuk kuralı gibi görülen davranıştır. Hâkim, kanunda hüküm yoksa önce örf-âdete, o da yoksa kanun koyucu olsaydı koyacağı kurala göre karar verir (TMK m.1).","<b>Hiyerarşi:</b> Anayasa → kanun ve andlaşma → Cumhurbaşkanlığı kararnamesi → yönetmelik. Alt norm üst norma aykırı olamaz.","Eski kitaplarda hiyerarşide ‘KHK’ geçer; kendi ders kitabında hangisi yazıyorsa onu esas al."],
"3-2":["Hukuk, düzenlediği ilişkinin tarafına göre ikiye ayrılır. Ayrımın ölçütü, ilişkide devletin egemenlik gücüyle bulunup bulunmadığıdır.","<b>Kamu hukuku:</b> anayasa, idare, ceza, vergi, usul hukukları ve uluslararası kamu hukuku. Devlet burada üstün konumdadır.","<b>Özel hukuk:</b> medeni hukuk (kişiler, aile, miras, eşya), borçlar, ticaret hukuku. Taraflar eşittir.","Kamu hukukunda kurallar çoğunlukla <b>emredici</b>dir; özel hukukta irade serbestisi (sözleşme özgürlüğü) geçerlidir.","İş ve sosyal güvenlik hukuku hem kamu hem özel unsur taşıdığı için çoğu kitapta ayrı veya karma alan sayılır.","Ayırt etmenin hızlı yolu: ‘Devlet egemenlik gücüyle var mı?’ Evetse kamu hukuku."],
"3-3":["Hak, hukuk düzeninin kişiye tanıdığı ve çıkarını korumaya yarayan yetkidir. Her hakkın bir sahibi, konusu ve içeriği vardır.","<b>Konusuna göre:</b> kişilik hakları (yaşam, beden bütünlüğü, ad, onur), aile hakları, mal varlığı hakları.","<b>Mutlak haklar</b> herkese karşı ileri sürülür (mülkiyet, kişilik hakları); <b>nispi haklar</b> yalnız belli kişiye karşı ileri sürülür (alacak hakkı).","<b>Kazanma yolları:</b> doğum, sözleşme, miras, haksız fiil, kanun hükmü. Hak <i>aslî</i> (daha önce kimsenin olmayan şeyin sahiplenilmesi) ya da <i>devren</i> (mevcut hakkın başkasına geçmesi, ör. satış) kazanılır.","Mal varlığı hakları devredilebilir, kişilik hakları devredilemez.","Mutlak/nispi ayrımını ‘mülkiyet-alacak’ örneğiyle hatırla."],
"3-4":["Hakkın sahibi olmak yetmez, nasıl kullanılacağı da kurallara bağlıdır. Ana ilke dürüstlük kuralıdır.","<b>TMK m.2:</b> Herkes haklarını kullanırken ve borçlarını yerine getirirken dürüstlük kurallarına uymak zorundadır. Hakkın açıkça kötüye kullanılmasını hukuk korumaz.","<b>İyiniyet (m.3):</b> bir durumu bilmemek veya bilmesi beklenmemek. Aksi ispatlanmadıkça iyiniyet kabul edilir (karine).","<b>Hakkın kötüye kullanılması:</b> hakkı, başkasına zarar vermek veya hakkın amacına aykırı sonuçlar için kullanmaktır.","<b>Korunma:</b> asıl yol mahkemede dava açmaktır. İddia eden iddiasını ispat eder (m.6). Meşru müdafaa ve zorunluluk hali istisnadır.","İyiniyet ‘bilmeme hali’, dürüstlük kuralı ise ‘davranış ölçüsü’dür; karıştırma."],
"3-5":["Kişi, hak ve borç sahibi olabilen varlıktır. Gerçek kişi insandır, tüzel kişi topluluktur. Bu ünite gerçek kişinin ehliyetlerini anlatır.","<b>Hak ehliyeti (m.8):</b> her insanda vardır; sağ doğumla başlar, ölümle sona erer. Ana rahmindeki çocuk sağ doğmak şartıyla hak ehliyeti kazanır. Hak ehliyeti sınırlandırılamaz.","<b>Fiil ehliyeti (m.9):</b> kendi fiilleriyle hak ve borç doğurabilme yeteneğidir. Şartlar: ergin olmak (18 yaş; evlenme de erginlik sağlar), ayırt etme gücüne sahip olmak, kısıtlı olmamak.","<b>Ayırt etme gücü (m.13):</b> akıl hastalığı, akıl zayıflığı, sarhoşluk gibi nedenlerle yoksa kişi ayırt etme gücünden yoksundur.","<b>Dereceler:</b> tam ehliyetli (ergin, ayırt etme gücü olan), sınırlı ehliyetsiz (ayırt etme gücü olan küçük ve kısıtlılar), tam ehliyetsiz (ayırt etme gücü olmayanlar).","Hak ehliyeti herkeste var; fiil ehliyeti şarta bağlı. Bu ayrım klasik sorudur."],
"3-6":["Tüzel kişi, hukukun kişi veya mal topluluklarına tanıdığı kişiliktir. Ortaklardan veya kurucudan bağımsız bir hak ve borç öznesi olur.","<b>Türleri:</b> özel hukuk tüzel kişileri (dernek, vakıf, şirket) ve kamu hukuku tüzel kişileri (devlet, belediye, üniversite).","<b>Kişi toplulukları:</b> dernek, şirket. <b>Mal toplulukları:</b> vakıf (belli bir malvarlığının amaca tahsisi).","<b>Kişilik kazanma:</b> dernek, kuruluş ve tüzüğüyle; ticaret şirketleri ticaret siciline tescille; vakıf, resmî senet veya vasiyetle kurulur ve tescille kişilik kazanır.","<b>Özellikleri:</b> adı, merkezi, malvarlığı ve organları vardır; hak ehliyetine sahiptir (evlenme gibi insana özgü haklar hariç), fiil ehliyetini organları aracılığıyla kullanır.","‘Kişi toplulukları dernek-şirket, mal topluluğu vakıf’ cümlesini ezberle."],
"5-0":["Ekonomi, kıt kaynakların sınırsız ihtiyaçları karşılamak için en iyi nasıl kullanılacağını inceler.","<b>İhtiyaç</b> giderilmek istenen eksikliktir, <b>kıtlık</b> kaynakların ihtiyaçlara yetmemesi, <b>fayda</b> ihtiyacı giderme gücü, <b>tercih</b> seçim yapmaktır.","Her ekonomi üç soruyu yanıtlar: Ne üretilecek? Nasıl üretilecek? Kimin için üretilecek?","<b>Fırsat maliyeti:</b> bir seçim yapılırken vazgeçilen en iyi alternatifin değeri. Örnek: 2 saatlik dersi seçip 500 TL kazanılacak işi bırakmak, fırsat maliyeti 500 TL’dir.","<b>Üretim olanakları sınırı:</b> eldeki kaynaklarla üretilebilecek en yüksek mal kombinasyonları. Eğri üstü ulaşılamaz, eğri altı verimsizdir.","<b>Mikro</b> ekonomi tek tek birimleri (tüketici, firma), <b>makro</b> ekonomi tüm ekonomiyi (enflasyon, işsizlik, büyüme) inceler.","Fırsat maliyeti ‘ödenen para’ değil ‘vazgeçilen en iyi seçenek’tir."],
"5-1":["Bu ünite tüketicinin sınırlı bütçesiyle faydasını nasıl en yükseğe çıkardığını anlatır.","<b>Toplam fayda (TF):</b> tüketilen tüm birimlerden alınan doyumdur. <b>Marjinal fayda (MF):</b> son tüketilen birimin eklediği faydadır.","MF azalırken TF artmaya devam eder; MF sıfır olunca TF en yüksek düzeye ulaşır.","<b>Azalan marjinal fayda yasası (Gossen):</b> aynı maldan her ek birimin sağladığı ek fayda azalır. Örnek: ilk pizza dilimi çok, beşincisi az doyum verir.","<b>Tüketici dengesi:</b> MF₁/P₁ = MF₂/P₂. Yani her mala harcanan son liranın faydası eşit olmalıdır.","Rasyonel tüketici bütçe kısıtı altında faydasını maksimize eder.","‘MF azalır, TF artar’ ayrımını iyi bil."],
"5-2":["Üretici (firma), emek, sermaye, doğal kaynak ve girişimciyi birleştirerek mal-hizmet üretir.","<b>Kısa dönem:</b> en az bir faktör sabit. <b>Uzun dönem:</b> tüm faktörler değişkendir.","<b>Toplam ürün</b> TÜ, <b>ortalama ürün</b> OÜ = TÜ/L, <b>marjinal ürün</b> MÜ = ΔTÜ/ΔL. MÜ, OÜ’nün üstündeyken OÜ artar.","<b>Azalan verimler yasası:</b> sabit faktöre değişken faktör eklendikçe MÜ bir noktadan sonra azalır. Örnek: küçük bir mutfağa sürekli aşçı eklemek.","<b>Maliyetler:</b> sabit maliyet (SM), değişken maliyet (DM), toplam maliyet TM = SM + DM; ortalama ve marjinal maliyet de hesaplanır.","Kısa dönem/uzun dönem ayrımı zaman uzunluğu değil faktörlerin sabit olup olmamasıdır."],
"5-3":["Talep, belli fiyatlarda alınmak istenen ve satın alma gücü olan miktardır. İstek tek başına talep değildir.","<b>Talep kanunu:</b> diğer şeyler sabitken fiyat artarsa talep edilen miktar azalır. Eğri aşağı eğimlidir.","<b>Eğri üzerinde hareket:</b> yalnızca malın kendi fiyatıyla olur (talep edilen miktar değişir).","<b>Eğrinin kayması:</b> fiyat dışı etkenlerle olur: gelir, zevk, nüfus, beklentiler, ilgili malların fiyatları (talep değişir).","<b>Mal türleri:</b> normal mal (gelir↑ talep↑), düşük mal (gelir↑ talep↓), ikame mal (çay-kahve: birinin fiyatı↑ diğerinin talebi↑), tamamlayıcı mal (araba-benzin: birinin fiyatı↑ diğerinin talebi↓).","‘Talep’ ile ‘talep edilen miktar’ farkı bu ünitenin en sevilen sorusudur."],
"5-4":["Arz, üreticilerin belli fiyatlarda satmak istediği miktardır.","<b>Arz kanunu:</b> fiyat artınca arz edilen miktar artar; eğri yukarı eğimlidir.","Fiyat değişimi eğri üzerinde hareket, fiyat dışı etkenler eğriyi kaydırır: girdi maliyetleri, teknoloji, vergi/sübvansiyon, satıcı sayısı, beklentiler.","Maliyet artarsa arz azalır (sola kayar); teknoloji gelişirse veya sübvansiyon verilirse arz artar (sağa kayar).","<b>Piyasa arzı:</b> tek tek firmaların arzlarının yatay toplamıdır.","Talepte olduğu gibi: fiyat → hareket, fiyat dışı → kayma."],
"5-5":["Piyasa dengesi, arz ve talep eğrilerinin kesiştiği noktada oluşur: Qd = Qs.","Fiyat denge fiyatının üstündeyse <b>arz fazlası</b> doğar, fiyat düşer. Altındaysa <b>talep fazlası</b> doğar, fiyat yükselir.","<b>Sayısal örnek:</b> Qd = 100 − 2P, Qs = 20 + 2P ise 100 − 2P = 20 + 2P, 4P = 80, P = 20, Q = 60.","Talep artarsa denge fiyat ve miktar artar. Arz artarsa denge fiyat düşer, miktar artar.","<b>Taban fiyat</b> dengenin üstündeyse arz fazlası, <b>tavan fiyat</b> dengenin altındaysa talep fazlası (kıtlık) doğar.","Soru çözerken önce eşitliği kur: arz = talep."],
"5-6":["Esneklik, bir değişkendeki değişime diğerinin ne kadar tepki verdiğini ölçer.","<b>Fiyat esnekliği:</b> Ed = %ΔQd / %ΔP (mutlak değer alınır).","|E| > 1 esnek, |E| < 1 esnek değil (inelastik), |E| = 1 birim esnek, 0 tam inelastik, sonsuz tam esnek.","<b>Esnekliği belirleyenler:</b> ikame mal çokluğu, malın zorunlu mu lüks mü olduğu, bütçedeki payı, zaman. Ekmek esnek değil, lüks mallar esnektir.","<b>Gelir esnekliği:</b> normal mallarda pozitif, düşük mallarda negatif. <b>Çapraz esneklik:</b> ikame mallarda pozitif, tamamlayıcı mallarda negatif.","<b>Toplam harcama:</b> talep esnekse fiyat artışı toplam harcamayı azaltır; esnek değilse artırır.","Esnek talepte fiyat↑ gelir↓, esnek olmayanda fiyat↑ gelir↑."]
};
Object.assign(X,{
"3-0":["Toplum hayatında düzen için davranış kuralları gerekir. Bunların tümüne <b>sosyal kurallar</b> denir: din, ahlak, görgü (nezaket), hukuk. Hukuk, bunların içinde yaptırımı devlet gücüyle uygulanan tek kuraldır.","<b>Din:</b> kaynağı ilahi; yaptırımı manevi/uhrevi. İnsanın Tanrı’ya, kendine ve topluma karşı ödevlerini düzenler.","<b>Ahlak:</b> kaynağı vicdan; yaptırımı vicdan azabı. Daha çok insanın <i>iç dünyasını</i> (niyet) ilgilendirir.","<b>Görgü:</b> kaynağı toplumsal gelenek; yaptırımı topluluğun ayıplaması, dışlaması. Küçük günlük davranışları düzenler.","<b>Hukuk:</b> kaynağı devlet; yaptırımı maddi ve devlet gücüne dayanır. Daha çok <i>dış davranışı</i> düzenler.","<b>Hukuk kuralının özellikleri:</b> (1) <b>genel</b> – belirli kişiye değil herkese; (2) <b>soyut</b> – tek olaya değil, benzer olay tiplerine; (3) <b>zorlayıcı</b> – uyulmazsa yaptırım; (4) <b>devletçe konulmuş / devlet gücüyle desteklenmiş</b>; (5) toplumsaldır.","<b>Yaptırım türleri:</b> cezai yaptırım (hapis, adli para cezası); tazminat (zararın giderilmesi); cebri icra (borcun zorla ödettirilmesi); hükümsüzlük (işlemin geçersiz sayılması); disiplin yaptırımı (kamu görevlisine uyarı, kınama vb.).","<b>Hukukun amaçları:</b> adalet, hukuki güvenlik (kuralların belli, öngörülebilir olması), kamu yararı (toplumun ortak faydası), eşitlik, barışın korunması.","<b>Hukuk kuralının yapısı:</b> bir <i>varsayım</i> (olay), bir <i>emir-yasak-izin</i> ve bir <i>yaptırım</i> içerir. ‘Şu olursa, şu olur’ mantığıdır.","Karşılaştırma sorularında üç anahtar: ahlak = iç dünya + manevi yaptırım; hukuk = dış davranış + devlet yaptırımı; görgü = toplumsal ayıplama."],
"3-1":["Hukukun kaynağı, hukuk kuralının hangi yoldan ortaya çıktığıdır. İki gruba ayrılır: <b>asli kaynaklar</b> (doğrudan kural koyar) ve <b>yardımcı kaynaklar</b> (kuralın anlaşılmasına yardım eder).","<b>Yazılı asli kaynaklar:</b> Anayasa, kanunlar, uluslararası andlaşmalar, Cumhurbaşkanlığı kararnamesi, yönetmelikler. Bazı ders kitaplarında eski düzene göre KHK ve tüzük de anılır.","<b>Anayasa:</b> devletin temel organlarını ve temel hak-özgürlükleri düzenleyen en üst normdur. Anayasa’ya aykırı kanun Anayasa Mahkemesi’nde iptal edilebilir.","<b>Kanun:</b> TBMM çıkarır, Cumhurbaşkanı yayımlar, Resmî Gazete’de yayımlanarak yürürlüğe girer. Kural olarak <i>geriye yürümez</i>; istisna olarak suç ve cezalarda failin lehine olan kanun geriye yürür.","<b>Uluslararası andlaşmalar (Anayasa m.90):</b> usulüne uygun yürürlüğe girince kanun hükmündedir. Temel hak ve özgürlüklere ilişkin andlaşmalarla kanun çatışırsa andlaşma hükmü esas alınır.","<b>Cumhurbaşkanlığı kararnamesi:</b> yürütme yetkisine dair düzenleme; Anayasa’da münhasıran kanunla düzenlenmesi gereken konularda çıkarılamaz. Kanunla aynı konuda farklı hüküm varsa kanun esas alınır.","<b>Yönetmelik:</b> idarenin kanun ve kararnamelere dayanarak çıkardığı genel düzenleyici işlemdir; kanuna aykırı olamaz.","<b>Yazısız kaynak: örf ve âdet.</b> Uzun süre uygulanıp bağlayıcı sayılan davranıştır. TMK m.1: Kanun lafzıyla ya da özüyle her hukuki meseleye uygulanır. Kanunda hüküm yoksa hâkim önce örf-âdete, o da yoksa kendisi kanun koyucu olsaydı koyacağı kurala göre karar verir; bunu yaparken bilimsel görüş ve yargı kararlarından yararlanır.","<b>Yardımcı kaynaklar:</b> yargı kararları (içtihat) ve bilimsel görüşler (doktrin). Bağlayıcı değildir, yol göstericidir.","<b>Yorum yöntemleri:</b> lafzi (sözcük anlamı), sistematik (diğer maddelerle birlikte), tarihsel (yapıldığı dönem), amaçsal (maddenin amacı). <b>Kıyas:</b> benzer olaya benzer kuralın uygulanması; ceza hukukunda kıyas yasaktır.","Hiyerarşi sorusunda en üstte Anayasa; kanun ve andlaşma aynı seviyede, altında kararname ve yönetmelik gelir. TMK m.1’in sıralaması (kanun, örf-âdet, hâkimin kural koyması) sık sorulur."],
"3-2":["Hukuk, düzenlediği ilişkilere göre kamu ve özel hukuk olarak ikiye ayrılır. Kamu-özel ayrımı hukukun en temel sınıflandırmasıdır.","<b>Ayrım ölçütleri:</b> (1) ilişkide <i>devlet egemenlik gücüyle</i> var mı (egemenlik/üstünlük teorisi); (2) korunan çıkar kamu yararı mı özel yarar mı (menfaat teorisi); (3) tarafların eşit mi, biri üstün mü olduğu.","<b>Kamu hukuku dalları:</b> Anayasa hukuku (devletin teşkilatı ve temel haklar), idare hukuku (kamu hizmeti, idari işlemler), ceza hukuku (suç ve cezalar, TCK), mali hukuk (vergi, bütçe), yargılama usul hukuku (HMK, CMK, İYUK), uluslararası kamu hukuku (devletlerarası ilişkiler).","<b>Özel hukuk dalları:</b> medeni hukuk (TMK: kişiler, aile, miras, eşya hukuku), borçlar hukuku (TBK), ticaret hukuku (TTK), uluslararası özel hukuk (yabancılık unsuru taşıyan özel hukuk ilişkileri).","<b>İş hukuku ve sosyal güvenlik hukuku:</b> hem kamu hem özel unsur taşıdığı için karma ya da ayrı bir alan (sosyal hukuk) sayılır; kitabında nasıl yazıyorsa öyle öğren.","<b>Maddi hukuk – şekli (usul) hukuk:</b> maddi hukuk hak ve borçların içeriğini belirler (TMK, TBK, TCK); şekli hukuk bunların mahkemede nasıl uygulanacağını gösterir (HMK, CMK).","<b>Emredici ve tamamlayıcı kurallar:</b> emredici kurallara aykırı sözleşme yapılamaz (kamu düzeni), kamu hukuku çoğunlukla emredicidir. Tamamlayıcı (yedek) kurallar, taraflar aksini kararlaştırmadıysa uygulanır; özel hukukta çoktur.","<b>Genel ve özel kural:</b> özel kural genel kurala göre önceliklidir.","Sorularda ‘dava açma yolları’ ya da ‘vergi’ görürsen kamu, ‘sözleşme, miras, aile’ görürsen özel hukuk de."],
"3-3":["Hak, hukuk düzeninin bir kişiye tanıdığı ve çıkarını korumaya yarayan yetkidir. Her hakkın bir <b>öznesi</b> (hak sahibi), <b>konusu</b> (üzerinde hak olan şey) ve <b>içeriği</b> (yetki) vardır.","<b>Konusuna göre haklar:</b> kişilik hakları (yaşam, beden bütünlüğü, ad, onur, özel hayat), aile hakları (eşlik, velayet), mal varlığı hakları (ayni haklar, alacak hakları, fikri haklar).","<b>Mutlak haklar:</b> herkese karşı ileri sürülür. Örnekler: mülkiyet, intifa, rehin, kişilik hakları. <b>Nispi (şahsi) haklar:</b> yalnızca belli kişiye, yani borçluya karşı ileri sürülür. Örnek: alacak hakkı.","<b>Ayni haklar:</b> bir şey üzerinde doğrudan hakimiyet sağlar. Mülkiyet tam ayni haktır; irtifak, intifa, rehin sınırlı ayni haklardır.","<b>Yenilik doğuran haklar:</b> tek taraflı irade beyanıyla hukuki durumu değiştirir (fesih, iptal, cayma, şufa).","<b>Hakların kazanılması:</b> <i>aslî kazanma</i> (hak ilk kez doğar; örn. sahipsiz malın sahiplenilmesi), <i>devren kazanma</i> (mevcut hak başkasına geçer). Devren kazanma <i>külli halefiyet</i> (bütün mal varlığı topluca: miras) ve <i>cüz’i halefiyet</i> (tek tek haklar: satış, bağış) olarak ikiye ayrılır.","<b>Hakların sona ermesi:</b> hak sahibinin ölümü, hakkın kullanılması, feragat (vazgeçme), konunun yok olması, <b>zamanaşımı</b> ve <b>hak düşürücü süre</b>.","<b>Zamanaşımı:</b> süre geçince hak ortadan kalkmaz, borçlu zamanaşımı def’ini ileri sürerse alacak dava edilemez hale gelir; hâkim kendiliğinden (re’sen) dikkate almaz. <b>Hak düşürücü süre:</b> süre dolunca hak tamamen ortadan kalkar; hâkim kendiliğinden dikkate alır.","Mutlak/nispi: mülkiyet ve kişilik hakları mutlak, alacak nispi. Zamanaşımı = def’i, hak düşürücü süre = re’sen dikkate alınır. Bu iki ayrım neredeyse her sınavda çıkar."],
"3-4":["Haklar kullanılırken belli sınırlara uyulmalıdır. Bu sınır <b>dürüstlük kuralı</b> ve <b>hakkın kötüye kullanılması yasağı</b> ile çizilir.","<b>TMK m.2:</b> Herkes haklarını kullanırken ve borçlarını yerine getirirken dürüstlük kurallarına uymak zorundadır. Bir hakkın açıkça kötüye kullanılmasını hukuk düzeni korumaz.","<b>Dürüstlük kuralı:</b> karşı tarafın makul beklentilerini boşa çıkarmamak, sözleşmede güven oluşturmak, tutarlı davranmak demektir. Hâkime kuralın boşluklarında yön verir.","<b>Hakkın kötüye kullanılması:</b> hakkı sırf başkasına zarar vermek için, hakkın amacına aykırı ya da çıkarlar arasında çok orantısız biçimde kullanmaktır. Sonuç: hukuk hakkı korumaz; zarar doğmuşsa tazminat gerekebilir.","<b>İyiniyet (TMK m.3):</b> bir durumu bilmemek ya da bilmesi beklenmemektir. İyiniyet karinedir; aksini iddia eden ispatlar. Her duruma özen gösterilmesi gereken olaylarda ‘gerekli dikkat’ gösterilmemişse iyiniyet iddia edilemez.","<b>İspat yükü (TMK m.6):</b> kanunda aksi öngörülmedikçe, iddia edilen olgudan lehine hak çıkaran taraf bu olguyu ispat etmek zorundadır. Resmi senet kesin delildir; aksini ispat edene kadar geçerlidir.","<b>Delil türleri:</b> senet, ikrar, yemin, tanık, bilirkişi, keşif. Kesin delil hâkimi bağlar; takdiri delil hâkimin serbestçe değerlendirdiği delildir.","<b>Hakların korunması:</b> asıl yol devlet yargısına başvurmaktır. Dava türleri: eda (bir şeyi yapma/ödeme), tespit (hak veya hukuki ilişkinin varlığının tespiti), yenilik doğuran dava (hukuki durumu değiştirme). İcra yoluyla alacağın tahsili de bir korunma yoludur.","<b>Kendi hakkını kendisi koruma:</b> kural olarak yasaktır (kendi adaletini sağlama). İstisnalar: meşru müdafaa, zorunluluk hali, kendi hakkını korumak amacıyla zorunlu müdahale.","İyiniyet ‘bilmeme hali’dir, dürüstlük kuralı ‘davranış ölçüsüdür’. m.2 = dürüstlük + kötüye kullanma, m.3 = iyiniyet, m.6 = ispat yükü."],
"3-5":["Kişi, hak ve borç sahibi olabilen varlıktır: gerçek kişi (insan) ve tüzel kişi. Bu ünite gerçek kişilerin ehliyetlerini ve kişilik haklarını anlatır.","<b>Kişiliğin başlangıcı (m.28):</b> sağ doğum ile başlar, ölümle sona erer. Ana rahmindeki çocuk sağ doğmak şartıyla doğumundan önce hak ehliyetine sahiptir (miras gibi).","<b>Ölüm ve gaiplik:</b> kişi, ölüm tehlikesi içinde kaybolur ve bir yıl geçerse; uzun süre haber alınamazsa beş yıl sonra hâkim kararıyla gaipliğine hükmedilir. Gaip ilan edilen kişi ölmüş sayılmaz ama hukuki sonuçlar ona göre düzenlenir.","<b>Hak ehliyeti (m.8):</b> herkes hak ehliyetine sahiptir; yaş, cinsiyet, akıl durumu fark etmez. Sınırlanamaz ve ondan vazgeçilemez.","<b>Fiil ehliyeti (m.9):</b> kendi fiil ve işlemleriyle hak edinip borç altına girebilme. <b>Üç şart:</b> ergin olmak (18 yaş; evlenmek de ergin kılar), ayırt etme gücüne sahip olmak (m.13), kısıtlı olmamak.","<b>Ayırt etme gücü:</b> akla uygun biçimde davranabilme yeteneği. Küçüklük, akıl hastalığı, akıl zayıflığı, sarhoşluk gibi nedenlerle yoksa kişi ayırt etme gücünden yoksundur.","<b>Fiil ehliyeti dereceleri:</b> <i>tam ehliyetli</i> (ergin, ayırt etme gücü olan, kısıtlı olmayan); <i>sınırlı ehliyetsiz</i> (ayırt etme gücü olan küçükler ve kısıtlılar: kanuni temsilcinin rızası olmadan borç altına giremez, ama karşılıksız kazanma ve kişiye sıkı bağlı hakları tek başlarına kullanabilir; m.16); <i>tam ehliyetsiz</i> (ayırt etme gücü olmayanlar: işlemleri geçersiz, kanuni temsilcileri adına işlem yapar).","<b>Yerleşim yeri (ikametgâh, m.19):</b> sürekli kalma niyetiyle oturulan yerdir; bir kişinin aynı anda yalnız bir yerleşim yeri olur.","<b>Kişiliğin korunması (m.23 ve devamı):</b> kimse hak ve fiil ehliyetinden kısmen vazgeçemez, özgürlüklerini hukuka aykırı biçimde sınırlayamaz. Kişilik haklarına saldırıda koruma davaları açılır; adın korunması bu kapsamdadır.","Hak ehliyeti herkeste var, fiil ehliyeti üç şarta bağlı. m.16’daki ‘karşılıksız kazanma + kişiye sıkı bağlı hak’ ayrıntısı en çok kaçırılan noktadır."],
"3-6":["Tüzel kişi, hukukun belli amaç için bir araya gelen <b>kişi topluluklarına</b> ya da amaca ayrılan <b>mal topluluklarına</b> tanıdığı kişiliktir. Ortakların veya kurucunun ötesinde ayrı bir hak ve borç öznesidir.","<b>Türleri:</b> <i>özel hukuk tüzel kişileri</i> (dernek, vakıf, ticaret şirketleri, kooperatif) ve <i>kamu hukuku tüzel kişileri</i> (devlet, belediye, üniversite, SGK gibi kamu kurumları).","<b>Kişi toplulukları:</b> dernek (kar amacı olmayan, süresiz kişi topluluğu), şirketler (kâr amaçlı). <b>Mal toplulukları:</b> vakıf (bir malvarlığının belli bir amaca sürekli tahsisi).","<b>Ticaret şirketleri:</b> kolektif, komandit, anonim, limited. Ticaret siciline tescille tüzel kişilik kazanırlar.","<b>Kişilik kazanma:</b> dernek, kuruluş ve tüzüğüyle; vakıf, resmi senet ya da vasiyetle kurulup tescille; ticaret şirketleri ticaret siciline tescille.","<b>Organlar:</b> karar organı (genel kurul), yönetim organı (yönetim kurulu), denetim organı. Tüzel kişi iradesini organları aracılığıyla oluşturur ve fiil ehliyetini onlarla kullanır.","<b>Ehliyeti:</b> hak ehliyetine sahiptir; ancak yaş, cinsiyet, evlilik, hısımlık gibi insana özgü haklara sahip olamaz. Organların işlemleri tüzel kişiyi bağlar; organ kusurluysa tüzel kişiyle birlikte kendisi de sorumlu olabilir.","<b>Sona erme:</b> dernekte genel kurul kararı, mahkeme kararı ya da amacın gerçekleşmesi/ imkânsızlaşması; vakıfta amacın gerçekleştirilememesi. Ardından <b>tasfiye</b> yapılır.","Gerçek kişiden farkını bil: tüzel kişi evlenemez, soyadı taşımaz, miras bırakanın yerine geçemez gibi insana özgü haklara sahip değildir. ‘Kişi topluluğu dernek-şirket, mal topluluğu vakıf’ ayrımı kesin çıkar."]
});
const $=s=>document.querySelector(s),S=(()=>{try{return JSON.parse(localStorage.getItem("vz"))||{}}catch(e){return{}}})();
S.d=S.d||{};S.k=S.k||{};
const save=()=>{try{localStorage.setItem("vz",JSON.stringify(S))}catch(e){}};
let tab="k",cf=-1,fi=0,deck=[],qs=[],qi=0,sc=0,wr=[];
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pool=()=>D.flatMap((c,i)=>c[3].map((u,j)=>({i,j,k:i+"-"+j,t:u[0],n:u[1],q:u[2],c:u[3],o:[u[3],u[4],u[5]]}))).filter(x=>cf<0||x.i==cf);
function chips(){$("#chips").innerHTML=[["Tümü",-1],...D.map((c,i)=>[c[2]+" "+c[0],i])].map(([t,i])=>`<button class="chip ${cf==i?"on":""}" data-i="${i}">${t}</button>`).join("")}
function prog(){const n=Object.values(S.d).filter(Boolean).length;$("#pb").style.width=n/56*100+"%";$("#pt").textContent=`${n} / 56 ünite tamam ✨`}
function cd(){const dt=$("#dt").value,t=new Date(dt)-Date.now();let x=Math.max(0,t);const p=[["gün",864e5],["saat",36e5],["dk",6e4],["sn",1e3]];$("#cd").innerHTML=p.map(([l,m])=>{const v=Math.floor(x/m);x-=v*m;return`<div><b>${v}</b><small>${l}</small></div>`}).join("")}
function render(){chips();prog();const v=$("#v");
if(tab=="k")v.innerHTML=D.map((c,i)=>cf>=0&&cf!=i?"":`<div class="c"><h3 style="margin:0 0 6px">${c[2]} ${c[0]} · ${c[1]}</h3>${c[3].map((u,j)=>`<details><summary><input type="checkbox" data-k="${i}-${j}" ${S.d[i+"-"+j]?"checked":""}> ${j+1}. ${u[0]}</summary><p>${u[1]}</p><div class="an"><b>📖 Konu anlatımı</b><br>${L[i][j]}</div></details>`).join("")}</div>`).join("");
else if(tab=="a")v.innerHTML=D.map((c,i)=>cf>=0&&cf!=i?"":`<h3>${c[2]} ${c[0]} · ${c[1]}</h3>`+c[3].map((u,j)=>{const x=X[i+"-"+j];return`<div class="c"><h4 style="margin:0 0 6px">${j+1}. ${u[0]}</h4>`+(x?`<p>${x[0]}</p><ul>${x.slice(1,-1).map(t=>`<li>${t}</li>`).join("")}</ul><div class="tip">💡 ${x[x.length-1]}</div>`:`<p>${L[i][j]}</p>`)+`</div>`}).join("")).join("");
else if(tab=="f"){deck=deck.length&&deck._f==cf?deck:Object.assign(shuf(pool()),{_f:cf});fi=Math.min(fi,deck.length-1);const d=deck[fi],kn=Object.values(S.k).filter(Boolean).length;
v.innerHTML=`<p class="mu" style="text-align:center">Kart ${fi+1}/${deck.length} · Bildiğin: ${kn}</p><div class="fc" id="fc"><div class="fi"><div class="fs"><small class="mu">${D[d.i][0]}</small><h2>${d.t}</h2><small class="mu">çevirmek için dokun 👆</small></div><div class="fs b">${d.n}</div></div></div><div class="row"><button class="btn l" data-a="p">◀</button><button class="btn r" data-a="r">↻ Tekrar</button><button class="btn g" data-a="g">✓ Biliyorum</button><button class="btn l" data-a="n">▶</button><button class="btn l" data-a="s">🔀</button></div>`}
else if(!qs.length){const n=pool().length;v.innerHTML=`<div class="c" style="text-align:center"><h2>🧠 Mini test</h2><p class="mu">Seçili ders: ${cf<0?"Tümü (56 soru)":D[cf][0]+" ("+n+" soru)"}. Dersi yukarıdan seç.</p><button class="btn" data-a="t">Başla 🚀</button></div>`}
else if(qi>=qs.length){v.innerHTML=`<div class="c" style="text-align:center"><h2>${sc==qs.length?"🎉":"💪"} ${sc} / ${qs.length}</h2><div class="row"><button class="btn" data-a="t">Yeniden</button>${wr.length?`<button class="btn r" data-a="w">Yanlışlarımı çöz (${wr.length})</button>`:""}<button class="btn l" data-a="x">Çık</button></div></div>`}
else{const q=qs[qi];v.innerHTML=`<div class="c"><p class="mu">Soru ${qi+1}/${qs.length} · ${D[q.i][0]}</p><h3>${q.q}</h3>${q.s.map(o=>`<button class="o" data-o="${o.replace(/"/g,"&quot;")}">${o}</button>`).join("")}<p id="ex" class="mu"></p></div>`}}
document.addEventListener("click",e=>{const b=e.target.closest("button,.fc");if(!b)return;
if(b.dataset.t){tab=b.dataset.t;document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x==b));qs=[];return render()}
if(b.classList.contains("chip")){cf=+b.dataset.i;deck=[];fi=0;qs=[];return render()}
if(b.id=="fc"||b.closest("#fc"))return $("#fc").classList.toggle("f");
const a=b.dataset.a;
if(a){const d=deck[fi];if(a=="g"){S.k[d.k]=1;save()}if(a=="r"){S.k[d.k]=0;save()}
if(a=="n"||a=="g"||a=="r")fi=(fi+1)%deck.length;if(a=="p")fi=(fi-1+deck.length)%deck.length;if(a=="s"){deck=[];fi=0}
if(a=="t"||a=="w"){qs=shuf(a=="w"?wr:pool()).map(q=>({...q,s:shuf(q.o)}));qi=0;sc=0;wr=[]}if(a=="x")qs=[];return render()}
if(b.dataset.o!==undefined&&!b.dataset.lock){const q=qs[qi],ok=b.dataset.o==q.c;document.querySelectorAll(".o").forEach(x=>{x.dataset.lock=1;if(x.dataset.o==q.c)x.classList.add("ok")});if(!ok){b.classList.add("no");wr.push(q)}else sc++;
$("#ex").innerHTML=(ok?"✅ Aferin! ":"❌ Doğrusu: <b>"+q.c+"</b>. ")+q.n+`<br><button class="btn" style="margin-top:8px" data-a="q">Sonraki ▶</button>`;return}
});
document.addEventListener("click",e=>{if(e.target.dataset&&e.target.dataset.a=="q"){qi++;render()}},true);
document.addEventListener("change",e=>{if(e.target.dataset.k){S.d[e.target.dataset.k]=e.target.checked;save();prog()}});
$("#dt").value=S.dt||"2026-11-14T09:00";$("#dt").onchange=e=>{S.dt=e.target.value;save();cd()};
setInterval(cd,1000);cd();render();
</script></body></html>
